[paths]
db = "data/rundoctor.db"
log_dir = "runs"
results_dir = "results"

[ollama]
base_url = "http://localhost:11434/v1"

[models]
# Default: 8B-class models for 16GB RAM. Add e.g. "qwen3:14b" if you have more memory.
eval = ["qwen3:8b", "llama3.1:8b", "mistral"]
chat_default = "qwen3:8b"

[models.reasoning_effort]
# "none" disables qwen3's thinking mode: several times faster, and results are recorded
# as "qwen3:8b[reasoning=none]" so they never mix with thinking-mode results.
# Delete the line to evaluate qwen3 with thinking on.
"qwen3:8b" = "none"

[eval]
temperature = 0.2
repeats = 3
max_iterations = 8
