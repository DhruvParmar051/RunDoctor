[project]
name = "rundoctor"
version = "0.1.0"
description = "MCP server that lets LLM agents inspect, diagnose, and relaunch ML training runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "torch>=2.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rundoctor-server = "server:main"
rundoctor-chat = "client.chat:run"
rundoctor-eval = "evals.runner:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ is the import root: its modules and packages (server, db, client, ...) install top-level.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Report output intentionally uses typographic dashes and minus signs.
ignore = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

# CI runs on Linux: use CPU-only torch there (the default Linux wheel pulls in CUDA).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
